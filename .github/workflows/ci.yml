name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cherry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cherry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/cherry_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28"
      - uses: actions/cache@v4
        with:
          path: apps/backend/deps
          key: deps-${{ runner.os }}-${{ hashFiles('apps/backend/mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: apps/backend/_build
          key: build-${{ runner.os }}-${{ hashFiles('apps/backend/mix.lock') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('apps/backend/mix.lock') }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mobile

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

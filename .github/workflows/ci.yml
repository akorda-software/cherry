name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA a desplegar (rollback)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cherry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cherry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/cherry_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28"
      - uses: actions/cache@v4
        with:
          path: apps/backend/deps
          key: deps-${{ runner.os }}-${{ hashFiles('apps/backend/mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: apps/backend/_build
          key: build-${{ runner.os }}-${{ hashFiles('apps/backend/mix.lock') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('apps/backend/mix.lock') }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mobile

  test-backups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s infra/backup -p 'test_*.py'

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-mobile, test-backups]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Pausado hasta instalar el ventilador del PM1735 y completar el primer deploy.
    # Rehabilitar con las condiciones push/workflow_dispatch corregidas (ver runbook).
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    env:
      TARGET_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Conectividad privada al panel de Dokploy (VPN-only; nada de /api/* público).
      # Requiere TAILSCALE_OAUTH_SECRET (ephemeral) hasta la VM cherry-backend.
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          version: latest

      # Confirmar los endpoints exactos contra el /swagger de la versión instalada de Dokploy.
      - name: Desplegar imagen ${{ env.TARGET_SHA }} vía API de Dokploy
        run: |
          curl -fsS -X PATCH "${{ secrets.DOKPLOY_BASE_URL }}/api/applications/${{ secrets.DOKPLOY_APPLICATION_ID }}" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"dockerImage": "ghcr.io/${{ github.repository }}-backend:${{ env.TARGET_SHA }}"}'
          curl -fsS -X POST "${{ secrets.DOKPLOY_BASE_URL }}/api/applications/${{ secrets.DOKPLOY_APPLICATION_ID }}/deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}"

      # Mitiga Dokploy #3987: Swarm puede revertir el deploy y la UI mostrar "done".
      # La fuente de verdad es /healthz.version == sha desplegado.
      - name: Verificar convergencia (version == sha)
        run: |
          deadline=$((SECONDS + 600))
          until curl -fsS "${{ vars.PUBLIC_URL }}/healthz" | grep -q "\"version\":\"${TARGET_SHA}\""; do
            if [ $SECONDS -ge $deadline ]; then
              echo "ERROR: ${{ vars.PUBLIC_URL }}/healthz no converge a ${TARGET_SHA} en 10 min"
              curl -fsS "${{ vars.PUBLIC_URL }}/healthz" || true
              exit 1
            fi
            sleep 10
          done
          echo "OK: despliegue ${TARGET_SHA} verificado"

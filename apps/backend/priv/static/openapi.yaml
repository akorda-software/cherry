        distanceLabel:
          type: string
          nullable: true
        distanceKmApprox:
          type: integer
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ProfileTag'
        likedYou:
          type: boolean
        youLiked:
          type: boolean
        matchId:
          type: string
          format: uuid
          nullable: true
        conversationId:
          type: string
          format: uuid
          nullable: true
        isNewcomer:
          type: boolean
    ReceivedLikesPage:

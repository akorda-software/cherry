        onboardingRequired:
          type: boolean
        nextOnboardingStep:
          type: string
          nullable: true
    UndoResponse:
      type: object
      properties:
        undone:
          type: boolean
        profile:
          $ref: '#/components/schemas/DiscoveryCard'
    PublicProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        age:
          type: integer
        bio:
          type: string
          nullable: true
        gender:
          type: string
        lookingFor:

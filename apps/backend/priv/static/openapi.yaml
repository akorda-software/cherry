          format: uuid
        conversationId:
          type: string
          format: uuid
        matchedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        firstMessageAt:
          type: string
          format: date-time
          nullable: true
        otherProfile:

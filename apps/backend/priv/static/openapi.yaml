openapi: 3.0.3
info:
  title: Cherry API
  version: 0.1.0
  description: |
    REST API for the Cherry dating backend. Authenticated endpoints require a
    Phoenix-issued bearer access token from the social auth or refresh flow.
servers:
  - url: /
tags:
  - name: Auth
  - name: Bootstrap
  - name: Profile
  - name: Discovery
  - name: Matches
  - name: Chat
  - name: Safety
  - name: Settings
  - name: Push Notifications
  - name: Verification
  - name: Casework
paths:
  /api/auth/{provider}/callback:
    post:
      tags: [Auth]
      summary: Exchange a Google or Apple credential for a Cherry session.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, apple]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCallbackRequest'
      responses:
        '201':
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/dev/test-login:
    post:
      tags: [Auth]
      summary: Dev-only login without native providers.
      description: |
        Only when `:enable_dev_test_login` is on (dev). An empty body logs in as the
        shared test user; `email` logs in as that persona, creating it on first use
        (`displayName` is only used on creation). `device` is optional and may be partial.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: demo@cherry.dev
                displayName:
                  type: string
                  example: Lucía
                device:
                  type: object
                  properties:
                    installationId:
                      type: string
                    platform:
                      type: string
                      enum: [ios, android]
                    deviceName:
                      type: string
      responses:
        '201':
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          description: The account was deleted (`account_deleted`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dev login disabled (`dev_test_login_disabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid email (`invalid_email`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/session/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token and issue a new session pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refreshed session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/session:
    delete:
      tags: [Auth]
      summary: Revoke the refresh-token session family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Session revoked.
  /api/config:
    get:
      tags: [Bootstrap]
      summary: Read runtime feature flags, the instance identity and its minimum age.
      responses:
        '200':
          description: Public runtime config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
  /api/bootstrap:
    get:
      tags: [Bootstrap]
      summary: Get authenticated user and onboarding state.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bootstrap state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me/profile:
    get:
      tags: [Profile]
      summary: Get the current user's profile.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile and completeness state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Profile'
                  completeness:
                    type: boolean
    put:
      tags: [Profile]
      summary: Create or update the current user's draft profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/me/profile/complete:
    post:
      tags: [Profile]
      summary: Validate and mark the current profile complete.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
                  onboardingRequired:
                    type: boolean
        '422':
          description: Profile still misses required onboarding sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileIncompleteResponse'
  /api/me/discovery-preferences:
    get:
      tags: [Profile]
      summary: Get the current profile discovery preferences.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Discovery preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discoveryPreferences:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/DiscoveryPreference'
    put:
      tags: [Profile]
      summary: Upsert discovery preferences.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryPreferenceRequest'
      responses:
        '200':
          description: Updated discovery preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discoveryPreferences:
                    $ref: '#/components/schemas/DiscoveryPreference'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/photos/read-url:
    post:
      tags: [Profile]
      summary: Renew a private photo read URL after checking current viewer access.
      description: |
        The object key alone does not authorize access. Own photos remain available
        during onboarding/suspension; other profiles require current visibility,
        no block, good standing and age verification when enabled. Private R2 GET
        URLs expire after 300 seconds; do not persist or log them. Bearer URLs can
        be shared until expiry and cannot revoke already downloaded copies.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storageKey]
              properties:
                storageKey:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: Temporary read authorization (private, no-store).
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Private storage signer unavailable.
  /api/me/photos:
    get:
      tags: [Profile]
      summary: List active profile photos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active photos ordered by position.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
  /api/me/photos/upload-intent:
    post:
      tags: [Profile]
      summary: Create a single-use profile photo upload intent.
      description: |
        `uploadUrl` depends on STORAGE_ADAPTER: local storage → `PUT /api/uploads/{token}`
        (signed token, no bearer); R2/S3 → SigV4 presigned URL. Upload the raw body with
        every returned header. All URLs are absolute.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadIntentRequest'
      responses:
        '200':
          description: Signed upload details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUploadIntentResponse'
        '503':
          description: Photo storage is not configured (`storage_not_configured`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/me/photos/complete:
    post:
      tags: [Profile]
      summary: Verify the stored image and complete a direct photo upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoCompleteRequest'
      responses:
        '200':
          description: Created active photo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: '#/components/schemas/Photo'
        '503':
          description: Storage unavailable; retry completion without creating a new intent.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/me/photos/order:
    put:
      tags: [Profile]
      summary: Reorder the active photos.
      description: '`photoIds` must list every active photo exactly once; positions become 1..n.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoIds]
              properties:
                photoIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Active photos in their new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Photo'
        '422':
          description: Not a permutation of the active photos (`invalid_photo_ids`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/uploads/{token}:
    put:
      tags: [Profile]
      summary: Local storage upload target (the `uploadUrl` of an intent).
      description: |
        Only with STORAGE_ADAPTER=local. No bearer: the signed token authorises one
        storage key, content type, maximum size and expiry. Raw body (not multipart),
        `Content-Type` must match the intent; objects are never overwritten.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            example: '*'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          description: Invalid or expired token (`upload_token_invalid`, `upload_token_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The instance does not use local storage.
        '412':
          description: The object already exists (`upload_already_exists`).
        '413':
          description: Body larger than the signed maximum (`upload_too_large`).
        '415':
          description: Content-Type differs from the intent (`upload_content_type_mismatch`).
        '422':
          description: Not a JPEG/PNG/WebP of the declared type (`upload_invalid_image`).
        '503':
          description: Storage unavailable (`storage_unavailable`).
  /api/me/photos/{id}:
    delete:
      tags: [Profile]
      summary: Soft-delete one of the current profile photos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/me/tags:
    get:
      tags: [Profile]
      summary: List current profile tags.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Positive profile tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
    put:
      tags: [Profile]
      summary: Replace current profile tags.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagIdsRequest'
      responses:
        '200':
          description: Updated positive tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '422':
          $ref: '#/components/responses/TagSelectionError'
  /api/me/blocked-tags:
    get:
      tags: [Profile]
      summary: List tags blocked by the current profile.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Blocked tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  blockedTags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
    put:
      tags: [Profile]
      summary: Replace blocked tags.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagIdsRequest'
      responses:
        '200':
          description: Updated blocked tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  blockedTags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '422':
          $ref: '#/components/responses/TagSelectionError'
  /api/me/location:
    post:
      tags: [Profile]
      summary: Update approximate profile location.
      description: Coordinates are snapped to an approximate 500m grid before storage.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/me/push-token:
    post:
      tags: [Push Notifications]
      summary: Register or update the Expo push token for the current session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
      responses:
        '200':
          description: Registered push token metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/me/pause:
    post:
      tags: [Settings]
      summary: Pause profile discovery.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/me/unpause:
    post:
      tags: [Settings]
      summary: Unpause profile discovery if the profile is complete.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/me/account:
    delete:
      tags: [Settings]
      summary: Permanently erase the account and its linked data.
      description: Works before onboarding and for suspended accounts. Removes email, provider identity, document fingerprint, profile, shared conversations, linked cases, notices and audit from the database. The same login and document may create a new account from scratch. External files and tracked verification sessions have durable deletion retries; the response does not guarantee instantaneous erasure of caches or backups.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/me/summary:
    get:
      tags: [Social]
      summary: Badge counters (pending received likes, unseen new matches, unread conversations).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Activity summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/me/cases:
    get:
      tags: [Casework]
      summary: Private cases for the current user, including decisions addressed to them.
      description: Available before onboarding/verification and during suspension. No reporter or staff identities. Responses use Cache-Control no-store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseOffset'
      responses:
        '200':
          description: Up to 50 cases, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Casework]
      summary: Submit a privacy request or a service complaint.
      description: At most ten new requests per account per rolling 24 hours. Sending an erasure request does not itself delete data.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportCaseRequest'
      responses:
        '201':
          $ref: '#/components/responses/SupportCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: case_rate_limited.
  /api/me/cases/{id}:
    get:
      tags: [Casework]
      summary: Read a case belonging to or addressed to the current user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/SupportCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/me/cases/{id}/appeal:
    post:
      tags: [Casework]
      summary: Request review of a resolved report/complaint, once per user and original case.
      description: Review must be done by a different staff account. An appeal alone does not reverse a measure.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                statement:
                  type: string
                  minLength: 10
                  maxLength: 4000
      responses:
        '201':
          $ref: '#/components/responses/SupportCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: case_conflict (already appealed or not appealable).
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/me/notices:
    get:
      tags: [Casework]
      summary: Private acknowledgements and decision messages, newest first, up to 50.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseOffset'
      responses:
        '200':
          description: Notices for this user only; no email or external delivery.
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me/notices/{id}/read:
    post:
      tags: [Casework]
      summary: Mark a notice owned by this user as read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/me/verification:
    get:
      tags: [Verification]
      summary: Age verification status of the current user.
      description: |
        `required` mirrors the `age_verification_required` feature flag
        (`AGE_VERIFICATION_REQUIRED`, off by default). When it is on, the social
        API (discovery, profiles, likes, matches, conversations) answers 403
        `age_verification_required` until the user is verified, and the profile
        is not discoverable (pending verification, not paused). The same state is
        in `GET /api/bootstrap` (`ageVerification`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeVerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me/verification/nfc:
    post:
      tags: [Verification]
      summary: Verify age with an identity document read by NFC (DNI, TIE or passport).
      description: |
        The app reads DG1, DG2 and EF.SOD from the chip (PACE with the CAN, or
        BAC/PACE with the MRZ for passports) and sends them in base64. The server
        performs passive authentication against the trusted CSCA certificates,
        checks the holder is 18 or older and stores only status, method, date and
        a keyed fingerprint of the document (one document, one account). The data
        groups are never stored nor logged. Limit: 5 attempts per hour and 10 per
        day per user. A successful verification makes a pending profile
        discoverable again unless the user paused it. A minor's document erases
        the whole account (profile, photos, matches, messages, sessions and
        attempts); nothing about the document is kept.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NfcVerificationRequest'
      responses:
        '200':
          description: Verified (also when repeating with the same document).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeVerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`verification_revoked`: a previous verification was revoked.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`document_already_used` (another account) or `already_verified` (with another document).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `invalid_payload`; `underage` with `accountDeleted` (true: the account,
            its profile, photos and sessions were erased; the app must log out);
            `document_expired`; or `document_not_verified` with `reason`:
            `malformed_sod`, `unsupported_algorithm`, `missing_document_signer`,
            `invalid_signature`, `untrusted_certificate`, `certificate_expired`,
            `data_group_mismatch`, `malformed_dg1`, `invalid_check_digit`,
            `unsupported_document`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`too_many_attempts`; `retryAfter` (seconds) and the `Retry-After` header.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`verification_error` (unexpected server error; the document is not logged).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`age_verification_unavailable` (no DOCUMENT_FINGERPRINT_KEY configured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/me/verification/provider:
    post:
      tags: [Verification]
      summary: Start a selfie + document verification with the external provider (Didit).
      description: |
        Creates a Didit session for the current user and returns the URL of
        Didit's hosted flow (selfie and photo of an identity card, residence
        permit or passport), which the app opens in a browser. `callback` is
        where Didit sends the browser back when the flow ends: the app's own
        scheme (`cherry://...`) or `https://`; plain `http`, `file`,
        `javascript`, `data` are refused. Didit returns the same session while
        it has not started. Counts against the same attempt limit as NFC (5 per
        hour, 10 per day). Then poll `POST /api/me/verification/provider/check`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderSessionRequest'
      responses:
        '201':
          description: Session created (or reused).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`verification_revoked`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`already_verified`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_payload` (bad `callback`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`too_many_attempts`; `retryAfter` (seconds) and the `Retry-After` header.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`provider_error` (Didit failed or is unreachable).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`age_verification_unavailable` (no Didit credentials or no DOCUMENT_FINGERPRINT_KEY).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/me/verification/provider/check:
    post:
      tags: [Verification]
      summary: Read the decision of a provider session.
      description: |
        Asks Didit for the decision of a session started by the current user
        (another user's session is `session_not_found`). Not counted as an
        attempt. `pending`: the user has not finished; `in_review`: Didit is
        reviewing it manually (ask again later). When approved the server
        checks the document kind (identity card, residence permit or
        passport), that it is in force and that the holder is 18 or older, and
        stores the same as NFC (method `provider`) with the same document
        fingerprint, so one document is one account whatever the method. After
        a final decision the session is erased at Didit (photos, selfie and
        extracted data). A minor erases the whole account, as with NFC.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCheckRequest'
      responses:
        '200':
          description: Verified, pending or in review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`verification_revoked`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`session_not_found` (unknown, erased or of another user).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`document_already_used` (another account) or `already_verified` (with another document).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `invalid_payload` (`sessionId` is not a UUID); `underage` with
            `accountDeleted` (the account was erased; the app must log out);
            `document_expired`; `verification_declined` (Didit declined it);
            `session_expired` (expired or abandoned: start a new one);
            `unsupported_document` (not an identity card, residence permit or
            passport).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`verification_error`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`provider_error` (Didit failed or is unreachable).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`age_verification_unavailable`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/discovery/feed:
    get:
      tags: [Discovery]
      summary: Get a scored discovery feed.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque signed cursor from nextCursor, scoped to the viewer, valid for one hour.
      responses:
        '200':
          description: Discovery cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryFeedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Profile incomplete (onboarding hints) or paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryForbiddenResponse'
  /api/discovery/actions:
    post:
      tags: [Discovery]
      summary: Record a like/dislike swipe action.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeActionRequest'
      responses:
        '200':
          description: Swipe result, including match data when mutual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeActionResponse'
        '404':
          description: Target does not exist or is not visible (`profile_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The viewer already swiped this profile (`already_swiped`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/discovery/undo:
    post:
      tags: [Discovery]
      summary: Undo the most recent swipe if it was a dislike less than 10 minutes old.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The restored card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoResponse'
        '422':
          description: Nothing to undo (`nothing_to_undo`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/profiles/{id}:
    get:
      tags: [Social]
      summary: Public profile of another person (never coordinates).
      description: Visible when there is no block in either direction, neither account is deleted and the profile is discoverable, has a live match with the viewer, or liked the viewer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Public profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/PublicProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/likes/received:
    get:
      tags: [Social]
      summary: Pending likes received (free and visible), most recent first.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque signed cursor from nextCursor, scoped to the viewer, valid for 24 hours.
      responses:
        '200':
          description: Received likes page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedLikesPage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/matches:
    get:
      tags: [Matches]
      summary: List visible matches (active, not expired, no blocks, live accounts) by recent activity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InboxLimit'
        - $ref: '#/components/parameters/InboxCursor'
      responses:
        '200':
          description: Visible matches with last message and unread count.
          content:
            application/json:
              schema:
                type: object
                required: [matches, nextCursor]
                properties:
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchSummary'
                  nextCursor:
                    type: string
                    nullable: true
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/matches/{id}/unmatch:
    post:
      tags: [Matches]
      summary: Mark a match as unmatched.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/conversations:
    get:
      tags: [Chat]
      summary: List conversations of visible matches (same rules and data as /api/matches).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InboxLimit'
        - $ref: '#/components/parameters/InboxCursor'
      responses:
        '200':
          description: Conversations.
          content:
            application/json:
              schema:
                type: object
                required: [conversations, nextCursor]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSummary'
                  nextCursor:
                    type: string
                    nullable: true
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/conversations/{id}/match:
    get:
      tags: [Matches, Chat]
      summary: Get a visible match directly when opening its conversation from a notification.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Match and conversation header, with the same current visibility rules as the inbox.
          content:
            application/json:
              schema:
                type: object
                required: [match]
                properties:
                  match:
                    $ref: '#/components/schemas/MatchSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/conversations/{id}/messages:
    get:
      tags: [Chat]
      summary: List messages in a conversation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque cursor from nextCursor (an ISO 8601 instant is still accepted).
      responses:
        '200':
          description: Message history, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  nextCursor:
                    type: string
                    nullable: true
        '403':
          description: Not a participant, or the conversation is no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Chat]
      summary: Send a message via REST.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        '200':
          description: Created message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/conversations/{id}/read:
    post:
      tags: [Chat]
      summary: Mark the conversation as read up to now (participants only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{profile_id}/block:
    post:
      tags: [Safety]
      summary: Block another profile.
      security:
        - bearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/users/{profile_id}/report:
    post:
      tags: [Safety]
      summary: Report another profile.
      security:
        - bearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: Created report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Phoenix.Token
  parameters:
    CaseOffset:
      name: offset
      in: query
      description: Invalid offsets fall back to zero. Page size is fixed at 50.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    InboxLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    InboxCursor:
      name: cursor
      in: query
      schema:
        type: string
        description: Signed nextCursor scoped to the viewer, valid for one hour. Activity ordering uses the first page's reference instant; visibility is rechecked on every page.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SupportCase:
      description: The current user's private case projection.
      content:
        application/json:
          schema:
            type: object
            required: [case]
            properties:
              case:
                $ref: '#/components/schemas/SupportCase'
    Ok:
      description: Operation succeeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OkResponse'
    Unauthorized:
      description: Missing, expired, revoked, or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The current profile cannot perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Invalid request payload.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ValidationErrorResponse'
    TagSelectionError:
      description: |
        `too_many_tags` / `too_many_blocked_tags`; `invalid_tags` (unknown, malformed or
        inactive IDs) or `tag_conflict` (tag both positive and blocked), both with `tagIds`.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                enum: [too_many_tags, too_many_blocked_tags, invalid_tags, tag_conflict]
              tagIds:
                type: array
                items:
                  type: string
  schemas:
    SupportCase:
      type: object
      required: [id, kind, category, status, statement, outcome, response, insertedAt, resolvedAt, canAppeal]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [report, complaint, privacy, appeal, measure]
        category:
          type: string
        status:
          type: string
          enum: [open, resolved]
        statement:
          type: string
          nullable: true
          description: Only the submitter sees their own statement; hidden from the reported person.
        outcome:
          type: string
          nullable: true
          enum: [dismissed, warning, suspend, answered, refused, upheld, overturned, null]
        response:
          type: string
          nullable: true
          description: The appropriate message for this recipient, never the other party's message.
        insertedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        canAppeal:
          type: boolean
    SupportCaseRequest:
      oneOf:
        - type: object
          required: [kind, category, statement]
          properties:
            kind:
              type: string
              enum: [privacy]
            category:
              type: string
              enum: [access, rectification, erasure, restriction, portability, objection]
            statement:
              type: string
              minLength: 10
              maxLength: 4000
        - type: object
          required: [kind, category, statement]
          properties:
            kind:
              type: string
              enum: [complaint]
            category:
              type: string
              enum: [service, safety, other]
            statement:
              type: string
              minLength: 10
              maxLength: 4000
    CaseNotice:
      type: object
      required: [id, caseId, event, message, readAt, insertedAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        event:
          type: string
          enum: [received, resolved]
        message:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        insertedAt:
          type: string
          format: date-time
    AgeVerification:
      type: object
      required: [status, method, verifiedAt]
      properties:
        status:
          type: string
          enum: [unverified, verified, revoked]
        method:
          type: string
          nullable: true
          enum: [nfc_dni, nfc_passport, provider, eu_wallet, null]
          description: '`nfc_dni` covers identity cards (DNI, and TIE/NIE).'
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    AgeVerificationResponse:
      type: object
      required: [verification, required]
      properties:
        verification:
          $ref: '#/components/schemas/AgeVerification'
        required:
          type: boolean
          description: Whether verification is mandatory on this instance.
        providerAvailable:
          type: boolean
          description: |
            Whether selfie + document verification (Didit) is configured. Only in
            `GET /api/me/verification`.
    ProviderSessionRequest:
      type: object
      properties:
        callback:
          type: string
          maxLength: 200
          description: Where Didit sends the browser back (custom scheme or https).
          example: cherry://verify/selfie
    ProviderSessionResponse:
      type: object
      required: [sessionId, url]
      properties:
        sessionId:
          type: string
          format: uuid
        url:
          type: string
          description: Didit's hosted verification flow, to open in a browser.
    ProviderCheckRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
    ProviderCheckResponse:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [verified, pending, in_review]
        verification:
          $ref: '#/components/schemas/AgeVerification'
        required:
          type: boolean
          description: Only with `verified`.
    NfcVerificationRequest:
      type: object
      required: [dg1, dg2, sod]
      properties:
        dg1:
          type: string
          format: byte
          description: DG1 (MRZ) as read from the chip, base64. Max 1 KB decoded.
        dg2:
          type: string
          format: byte
          description: DG2 (facial image) as read from the chip, base64. Max 256 KB decoded.
        sod:
          type: string
          format: byte
          description: EF.SOD (Document Security Object), base64. Max 32 KB decoded.
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: profile_not_found
        reason:
          type: string
        retryAfter:
          type: integer
          description: Seconds to wait (only with `too_many_attempts`).
        accountDeleted:
          type: boolean
          description: Only with `underage`; true when the account was erased.
    ValidationErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    DeviceRequest:
      type: object
      required: [installationId, platform, deviceName]
      properties:
        installationId:
          type: string
        platform:
          type: string
          enum: [ios, android]
        deviceName:
          type: string
    AuthCallbackRequest:
      type: object
      required: [device]
      properties:
        providerToken:
          type: string
          description: Google provider token when provider is google.
        idToken:
          type: string
          description: Apple identity token when provider is apple.
        authorizationCode:
          type: string
        nonce:
          type: string
          description: Raw nonce used for Apple sign-in validation.
        device:
          $ref: '#/components/schemas/DeviceRequest'
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    SessionResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    ConfigResponse:
      type: object
      required: [features, instance, ageVerification]
      properties:
        features:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
        instance:
          type: object
          description: Who runs this instance (INSTANCE_* environment variables).
          required: [name, country, locale, operator, contactEmail, privacyUrl, termsUrl, sourceUrl]
          properties:
            name:
              type: string
              example: Cherry
            country:
              type: string
              description: ISO 3166-1 alpha-2 code.
              example: ES
            locale:
              type: string
              description: BCP 47 language tag.
              example: es-ES
            operator:
              type: string
              nullable: true
            contactEmail:
              type: string
              format: email
              nullable: true
            privacyUrl:
              type: string
              format: uri
              nullable: true
            termsUrl:
              type: string
              format: uri
              nullable: true
            sourceUrl:
              type: string
              format: uri
              nullable: true
              description: Source code of the server version (AGPL-3.0).
        ageVerification:
          type: object
          required: [minimumAge]
          properties:
            minimumAge:
              type: integer
              minimum: 18
              example: 18
    BootstrapResponse:
      type: object
      required: [user, profile, ageVerification]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profile:
          $ref: '#/components/schemas/ProfileState'
        ageVerification:
          $ref: '#/components/schemas/AgeVerificationState'
    AgeVerificationState:
      type: object
      required: [required, status, providerAvailable]
      description: |
        While `required` is true and `status` is not `verified`, the profile is
        pending verification: it can be edited but is not discoverable
        (`isDiscoverable` false, distinct from `isPaused`) and the social API
        answers 403 `age_verification_required`.
      properties:
        required:
          type: boolean
          description: Mirrors the `age_verification_required` feature flag (`AGE_VERIFICATION_REQUIRED`).
        status:
          type: string
          enum: [unverified, verified, revoked]
        providerAvailable:
          type: boolean
          description: Whether selfie + document verification (Didit) is configured.
    ProfileState:
      type: object
      required: [exists, isComplete, isDiscoverable, isPaused, onboardingRequired]
      properties:
        exists:
          type: boolean
        isComplete:
          type: boolean
        isDiscoverable:
          type: boolean
          description: |
            Shown to others: complete, not paused, not deleted and, while age
            verification is required, verified.
        isPaused:
          type: boolean
          description: Paused by the user (not set by a pending age verification).
        onboardingRequired:
          type: boolean
        nextOnboardingStep:
          type: string
          nullable: true
          enum:
            - name
            - birth_date
            - gender
            - intent
            - bio
            - photos
            - interested_in
            - discovery_preferences
            - tags
            - location
    RelationshipIntent:
      type: string
      enum: [relationship, casual, meet_people, go_with_the_flow]
    LookingFor:
      type: array
      description: >-
        «¿Qué buscas?»: intenciones elegidas, sin repetir y en orden canónico
        (relationship, casual, meet_people, go_with_the_flow). Vacía solo en un
        borrador sin contestar. Compatibilidad: dos personas encajan si algún
        par (mía, suya) es compatible (cada intención con ella misma y con
        go_with_the_flow, que encaja con todas; relationship y casual nunca se
        cruzan). Simétrico.
      maxItems: 4
      uniqueItems: true
      items:
        $ref: '#/components/schemas/RelationshipIntent'
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        age:
          type: integer
          nullable: true
        gender:
          type: string
          nullable: true
          enum: [man, woman, non_binary]
        lookingFor:
          $ref: '#/components/schemas/LookingFor'
        whatIAmLookingFor:
          deprecated: true
          type: string
          nullable: true
          enum: [relationship, casual, meet_people, go_with_the_flow]
          description: >-
            Obsoleto: primera intención de `lookingFor` (orden canónico) o null.
            Solo para versiones de la app anteriores a la elección múltiple.
        bio:
          type: string
          nullable: true
        isComplete:
          type: boolean
        isPaused:
          type: boolean
        isDiscoverable:
          type: boolean
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        blockedTags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        discoveryPreferences:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DiscoveryPreference'
        insertedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum: [man, woman, non_binary]
        looking_for:
          description: >-
            «¿Qué buscas?»: 1–4 intenciones sin repetir (se guardan en orden
            canónico). Por compatibilidad se acepta también una sola cadena
            (lista de un elemento) y las claves antiguas `what_i_am_looking_for`
            / `whatIAmLookingFor`. `null` deja el borrador sin contestar.
          oneOf:
            - type: array
              minItems: 1
              maxItems: 4
              uniqueItems: true
              items:
                $ref: '#/components/schemas/RelationshipIntent'
            - $ref: '#/components/schemas/RelationshipIntent'
          nullable: true
        what_i_am_looking_for:
          deprecated: true
          description: Alias antiguo de `looking_for` (una sola intención).
          $ref: '#/components/schemas/RelationshipIntent'
        bio:
          type: string
          minLength: 20
          maxLength: 240
    ProfileIncompleteResponse:
      type: object
      required: [error, missing]
      properties:
        error:
          type: string
          example: profile_incomplete
        missing:
          type: array
          items:
            type: string
        nextOnboardingStep:
          type: string
          nullable: true
    DiscoveryPreference:
      type: object
      properties:
        ageMin:
          type: integer
          minimum: 18
        ageMax:
          type: integer
          maximum: 100
        distanceKm:
          type: integer
          enum: [10, 25, 50, 100, 999999]
        showMen:
          type: boolean
        showWomen:
          type: boolean
        showNonBinary:
          type: boolean
        compatibleOnly:
          type: boolean
        expandDistance:
          type: boolean
          description: Adds a later distance tier up to min(2×radius, radius+100 km) when the preferred radius runs dry.
    DiscoveryPreferenceRequest:
      type: object
      description: Partial updates allowed; the merged result is validated (422 per field on error).
      required: [age_min, age_max, distance_km]
      properties:
        age_min:
          type: integer
          minimum: 18
          maximum: 100
        age_max:
          type: integer
          minimum: 18
          maximum: 100
          description: Must be greater than or equal to age_min.
        distance_km:
          type: integer
          enum: [10, 25, 50, 100, 999999]
        show_men:
          type: boolean
        show_women:
          type: boolean
        show_non_binary:
          type: boolean
        compatible_only:
          type: boolean
        expand_distance:
          type: boolean
          default: true
    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storageKey:
          type: string
        url:
          type: string
          format: uri
        position:
          type: integer
          minimum: 1
          maximum: 4
        isActive:
          type: boolean
    PhotoCreateRequest:
      type: object
      required: [storage_key, url, position]
      properties:
        storage_key:
          type: string
        url:
          type: string
          format: uri
        position:
          type: integer
          minimum: 1
          maximum: 4
        is_active:
          type: boolean
    PhotoUploadIntentRequest:
      type: object
      required: [position, contentType, sizeBytes]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 4
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          maximum: 2000000
    PhotoUploadIntentResponse:
      type: object
      properties:
        storageKey:
          type: string
        uploadUrl:
          type: string
          format: uri
        publicUrl:
          type: string
          format: uri
          description: Historical field name; unsigned storage reference, not public read access.
        method:
          type: string
          example: PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxBytes:
          type: integer
    PhotoCompleteRequest:
      type: object
      required: [storageKey]
      properties:
        storageKey:
          type: string
        publicUrl:
          type: string
          format: uri
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        label:
          type: string
        category:
          type: string
        sortOrder:
          type: integer
        emoji:
          type: string
          nullable: true
          example: 🎵
    TagIdsRequest:
      type: object
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
    LocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
        recordedAt:
          type: string
          format: date-time
    PushTokenRequest:
      type: object
      required: [expoPushToken, platform, installationId]
      properties:
        expoPushToken:
          type: string
          pattern: '^(ExponentPushToken|ExpoPushToken)\[[^\]]+\]$'
        platform:
          type: string
          enum: [ios, android]
        installationId:
          type: string
    PushTokenResponse:
      type: object
      properties:
        ok:
          type: boolean
        pushToken:
          type: object
          properties:
            id:
              type: string
              format: uuid
            platform:
              type: string
            installationId:
              type: string
            status:
              type: string
            lastSeenAt:
              type: string
              format: date-time
    DiscoveryFeedResponse:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryCard'
        nextCursor:
          type: string
          description: Opaque cursor; send unchanged for the next page.
          nullable: true
    DiscoveryCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        age:
          type: integer
        bio:
          type: string
        gender:
          type: string
        lookingFor:
          $ref: '#/components/schemas/LookingFor'
        whatIAmLookingFor:
          deprecated: true
          type: string
          nullable: true
          description: Obsoleto, primera intención de `lookingFor`.
        distanceLabel:
          type: string
          nullable: true
        distanceKmApprox:
          type: integer
          nullable: true
        score:
          type: number
        sharedTagsCount:
          type: integer
        photoUrl:
          type: string
          format: uri
          nullable: true
        photoCount:
          type: integer
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoSummary'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ProfileTag'
        likedYou:
          type: boolean
        isNewcomer:
          type: boolean
        beyondPreferredDistance:
          type: boolean
    PhotoSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        position:
          type: integer
    ProfileTag:
      allOf:
        - $ref: '#/components/schemas/Tag'
        - type: object
          properties:
            emoji:
              type: string
              nullable: true
            sortOrder:
              type: integer
            shared:
              type: boolean
              description: The viewer also has this positive tag.
    DiscoveryForbiddenResponse:
      type: object

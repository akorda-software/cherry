<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614 800" width="614" height="800">
  <!--
    Logo de Cherry: un par de cerezas cuyas hojas son dos corazones. Fuente vectorial del
    componente `CherryMark` (src/shared/ui/art/cherry-mark-geometry.ts usa estos mismos trazados)
    y de los iconos de assets/images. Colores de brandPalette: tinta (rabitos), mentaDeep (hojas),
    primary (cerezas) y papel (brillos).
  -->
  <title>Cherry</title>
  <!-- Rabito común con la rama de la hoja pequeña, y los dos rabitos de las cerezas -->
  <path
    d="M320 304L307.2 212.9M314.2 263L339.7 247.1M178 484Q186 384 320 304M454 526Q414 404 320 304"
    fill="none" stroke="#1D1426" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hojas-corazón: la grande, inclinada a la izquierda, y la pequeña, a la derecha -->
  <path
    d="M307.2 212.9C268.9 194.7 188.1 173.5 167.1 121.5A47.8 52 -22 0 1 255.8 85.6A47.8 52 -22 0 1 344.5 49.8C365.5 101.8 322.1 173.2 307.2 212.9Z"
    fill="#1E7A3E"/>
  <path
    d="M339.7 247.1C348.5 214.9 353.9 149.2 391.5 125.8A37.7 41 58 0 1 431.5 189.7A37.7 41 58 0 1 471.4 253.7C433.9 277.2 372.5 253.3 339.7 247.1Z"
    fill="#1E7A3E"/>
  <!-- Cerezas -->
  <circle cx="462" cy="648" r="136" fill="#FF6B57"/>
  <circle cx="170" cy="624" r="154" fill="#FF6B57"/>
  <!-- Brillos -->
  <path d="M74.5 589.2A101.6 101.6 0 0 1 127 531.9" fill="none" stroke="#FAF6F0" stroke-width="20" stroke-linecap="round"/>
  <path d="M377.7 617.3A89.8 89.8 0 0 1 424.1 566.6" fill="none" stroke="#FAF6F0" stroke-width="17.7" stroke-linecap="round"/>
</svg>

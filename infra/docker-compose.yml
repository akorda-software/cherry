# Nombre de proyecto explícito: evita que el nombre derive de la carpeta.
name: cherry

services:
  mobile:
    image: node:24.11-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && sleep infinity"
    volumes:
      - ..:/workspace
    profiles: ["mobile"]

  backend:
    image: hexpm/elixir:1.18.4-erlang-28-debian-bookworm-slim
    working_dir: /workspace/apps/backend
    command: sh -lc "mix local.hex --force && mix local.rebar --force && sleep infinity"
    environment:
      MIX_ENV: dev
      DATABASE_URL: ecto://postgres:postgres@postgres/cherry_dev
    # mix phx.server dentro del contenedor (dev.exs escucha en 0.0.0.0:4000).
    ports:
      - "4000:4000"
    volumes:
      - ..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["backend"]

  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cherry_dev
    # Solo en este equipo: la base de datos de desarrollo no se publica en la red.
    ports:
      - "127.0.0.1:5510:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cherry_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Desde PostgreSQL 18 la imagen guarda los datos en /var/lib/postgresql/18/docker:
    # el volumen se monta en /var/lib/postgresql. Volumen nuevo: el de la 17
    # (`postgres-data`) no sirve con la 18; ver infra/README.md.
    volumes:
      - postgres18-data:/var/lib/postgresql

volumes:
  postgres18-data:
